<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan</title>
    <!-- Iklan Script 1 & 2 -->
    <script src="https://deductpursue.com/48/cf/ee/48cfeecf17e3bc0d49659bbc3994d57b.js"></script>
    <script src="https://deductpursue.com/31/3d/3d/313d3dea3b97439b6c4dd5c5a0b8f73b.js"></script>

    <style>
        /* Base Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Container Premium */
        .verification-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            transition: all 0.5s ease;
            z-index: 10;
            margin-bottom: 20px;
        }

        /* Checkbox Style */
        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            cursor: pointer;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: #111;
        }

        .checkbox {
            width: 25px;
            height: 25px;
            border: 2px solid #555;
            border-radius: 4px;
            position: relative;
            transition: 0.3s;
        }

        .checkbox.loading {
            border-top-color: #f39c12;
            animation: spin 1s infinite linear;
            border-radius: 50%;
        }

        .checkbox.checked::after {
            content: '✔';
            color: #27ae60;
            font-size: 20px;
            position: absolute;
            top: -5px;
            left: 3px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Button Container */
        .button-group {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            text-decoration: none;
            display: block;
        }

        .btn-view {
            background: #ffffff;
            color: #000;
        }

        .btn-watch {
            background: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }

        .status-text {
            font-size: 14px;
            color: #888;
            margin-top: 10px;
        }

        /* Native Banner Wrapper */
        #ad-container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            min-height: 100px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="verification-card">
        <div class="checkbox-container" id="checkContainer" onclick="startVerification()">
            <div class="checkbox" id="box"></div>
            <span>Saya bukan robot</span>
        </div>
        <p class="status-text" id="statusMsg">Klik untuk konfirmasi</p>

        <div class="button-group" id="btnGroup">
            <!-- Smartlink pada tombol -->
            <a href="https://deductpursue.com/mz7pf8x12c?key=cbd09e6311e0462040e6195817956dd7" class="btn btn-view">Lihat Vidionya</a>
            <a href="https://deductpursue.com/mz7pf8x12c?key=cbd09e6311e0462040e6195817956dd7" class="btn btn-watch">Nonton Vidio</a>
        </div>
    </div>

    <!-- Container Native Banner -->
    <div id="ad-container">
        <script async="async" data-cfasync="false" src="https://deductpursue.com/eac4a2d46ba5e971b2ac359f931c76d8/invoke.js"></script>
        <div id="container-eac4a2d46ba5e971b2ac359f931c76d8"></div>
    </div>

    <script>
        function startVerification() {
            const box = document.getElementById('box');
            const statusMsg = document.getElementById('statusMsg');
            const btnGroup = document.getElementById('btnGroup');
            const checkContainer = document.getElementById('checkContainer');

            // 1. Mulai Loading (10 detik)
            box.classList.add('loading');
            statusMsg.innerText = "Memproses...";
            checkContainer.style.pointerEvents = "none"; 

            setTimeout(() => {
                // 2. Berhasil Centang
                box.classList.remove('loading');
                box.classList.add('checked');
                statusMsg.innerText = "Verifikasi Berhasil";

                // 3. Munculkan Tombol setelah delay lagi (10 detik)
                setTimeout(() => {
                    statusMsg.innerText = "Menyiapkan konten...";
                    
                    setTimeout(() => {
                        btnGroup.style.display = 'flex';
                        setTimeout(() => {
                            btnGroup.style.opacity = '1';
                            statusMsg.innerText = "Silahkan pilih opsi:";
                        }, 50);
                    }, 10000); 
                }, 500);

            }, 10000); 
        }
    </script>
</body>
</html>
